spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: urlshortener
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: ${DATASOURCE_URL}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
